<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#D14B3F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saulutė">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Mokykis lietuvių kalbos žaisdamas — žodynas, gramatika ir skaičiai">
<title>Saulutė žaidžia lietuviškai</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Reusable inline sun mascot (saulutė) — the page's signature motif -->
<template id="tpl-sun-mascot">
  <svg viewBox="0 0 100 100" class="sun-mascot" role="img" aria-label="Saulutės maskotas">
    <g fill="#F2A93B">
      <polygon points="50,2 56,20 44,20"/>
      <polygon points="50,98 56,80 44,80"/>
      <polygon points="2,50 20,56 20,44"/>
      <polygon points="98,50 80,56 80,44"/>
      <polygon points="14,14 28,24 20,30"/>
      <polygon points="86,86 72,76 80,70"/>
      <polygon points="86,14 76,28 70,20"/>
      <polygon points="14,86 24,72 30,80"/>
    </g>
    <circle cx="50" cy="50" r="26" fill="#D14B3F"/>
    <circle cx="41" cy="46" r="3.2" fill="#FBF3E3"/>
    <circle cx="59" cy="46" r="3.2" fill="#FBF3E3"/>
    <path d="M 38 58 Q 50 68 62 58" stroke="#FBF3E3" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>
</template>

<div class="app-shell">

  <button id="btn-sound-toggle" class="sound-toggle" aria-label="Įjungti arba išjungti garsą" aria-pressed="false">🔊</button>
  <button id="btn-fullscreen-toggle" class="sound-toggle fullscreen-toggle" aria-label="Įjungti pilną ekraną" aria-pressed="false">⛶</button>

  <!-- ================= PRADŽIA ================= -->
  <section id="screen-home" class="screen">
    <div class="mascot-slot" data-mascot></div>
    <h1 class="title">Saulutė žaidžia!</h1>
    <p class="subtitle">Mokykis lietuvių kalbos žaisdamas</p>
    <p class="level-indicator">Klasė: <span id="home-level-label">1 klasė</span></p>
    <button id="btn-open-level" class="btn btn--secondary">Keisti klasę</button>
    <div class="folk-divider"></div>
    <div class="btn-row" style="margin-top:32px;">
      <button id="btn-start" class="btn btn--primary">Žaisti!</button>
    </div>
  </section>

  <!-- ================= KLASĖS PASIRINKIMAS ================= -->
  <section id="screen-level" class="screen">
    <h1 class="title" style="font-size:1.8rem;">Pasirink klasę</h1>
    <div class="level-grid" id="level-grid">
      <button class="level-card" data-level="1">1 klasė</button>
      <button class="level-card" data-level="2">2 klasė</button>
      <button class="level-card" data-level="3">3 klasė</button>
      <button class="level-card" data-level="4">4 klasė</button>
    </div>
    <button id="btn-level-back" class="btn btn--ghost" style="margin-top:24px;">← Atgal</button>
  </section>

  <!-- ================= TEMOS PASIRINKIMAS ================= -->
  <section id="screen-categories" class="screen">
    <h1 class="title" style="font-size:1.8rem;">Pasirink temą</h1>
    <div id="category-grid" class="category-grid"></div>
    <button id="btn-back-home" class="btn btn--ghost" style="margin-top:24px;">← Atgal</button>
  </section>

  <!-- ================= ŽAIDIMO TIPAS ================= -->
  <section id="screen-mechanic" class="screen">
    <h1 class="title" style="font-size:1.8rem;">Pasirink žaidimą</h1>
    <p class="subtitle" id="mechanic-subtitle"></p>
    <div id="mechanic-grid" class="mechanic-grid"></div>
    <button id="btn-mechanic-back" class="btn btn--ghost" style="margin-top:24px;">← Atgal</button>
  </section>

  <!-- ================= ŽAIDIMAS ================= -->
  <section id="screen-game" class="screen">
    <div class="game-header">
      <button id="btn-home-from-game" class="btn btn--ghost btn--small">🏠 Namai</button>
      <div id="game-category-label"></div>
    </div>
    <div id="game-area" style="width:100%;"></div>
  </section>

  <!-- ================= REZULTATAI ================= -->
  <section id="screen-results" class="screen">
    <div class="mascot-slot" data-mascot></div>
    <div id="results-content"></div>
    <div class="btn-row">
      <button id="btn-play-again" class="btn btn--primary">Dar kartą</button>
      <button id="btn-choose-another" class="btn btn--secondary">Kita tema</button>
      <button id="btn-home-from-results" class="btn btn--ghost">🏠 Namai</button>
    </div>
  </section>

</div>

  <script src="js/data.js"></script>
  <script src="js/phrases.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/mechanics/matching.js"></script>
  <script src="js/mechanics/quiz.js"></script>
  <script src="js/mechanics/dragdrop.js"></script>
  <script src="js/mechanics/fill.js"></script>
  <script src="js/mechanics/index.js"></script>
  <script src="js/oxo.js"></script>
  <script src="js/snake.js"></script>
  <script src="js/tetris.js"></script>
  <script src="js/game.js"></script>
  <script>
    document.querySelectorAll('[data-mascot]').forEach(slot => {
      const tpl = document.getElementById('tpl-sun-mascot');
      slot.appendChild(tpl.content.cloneNode(true));
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/app/service-worker.js', { scope: '/app/' })
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
